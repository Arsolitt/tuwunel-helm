{{- if .Values.ingress.enabled -}}
{{- $fullName := include "tuwunel.fullname" . -}}
{{- $servicePort := .Values.service.port -}}
{{- $ingressPath := .Values.ingress.path -}}
{{- $includeServerName := .Values.includeServerName -}}
{{- /* server_name is a Matrix name and may carry a port (`matrix.example.com:8448`),
       which the host fields below must not - tuwunel.host drops it (and refuses
       a scheme). Normalised once and used for every rule and TLS host. */}}
{{- $serverNameHost := include "tuwunel.host" (dict "value" .Values.server_name "label" "server_name") }}
{{- $delegatedDomain := "" }}
{{- /* config.global is a free-form passthrough map, so `config: {global: null}`
       is valid values: reading it defensively keeps a nulled block from
       aborting the render with `nil pointer evaluating interface {}.well_known`
       (the Gateway template reads it the same way). */}}
{{- $wellKnown := (get (get .Values.config "global" | default dict) "well_known" | default dict) }}
{{- $isDelegatedDomain := get $wellKnown "server" }}
{{- if $isDelegatedDomain }}
{{- /* A host field, so the port the delegated domain may carry is dropped:
       tuwunel.host owns that normalisation for every host this chart renders. */}}
{{- $delegatedDomain = include "tuwunel.host" (dict "value" $isDelegatedDomain "label" "config.global.well_known.server") }}
{{- end }}
{{- /* With the apex excluded and nothing else supplying a host, every rule and
       TLS entry below is empty - an Ingress the API server accepts and no
       request ever matches. Refused here rather than rendered, and before the
       `required` calls below so this names the value that caused it. */}}
{{- if and (not $includeServerName) (not $delegatedDomain) (not .Values.ingress.extraHosts) }}
{{- fail "includeServerName=false leaves the Ingress without a hostname: server_name is its only host unless the delegated domain (config.global.well_known.server) or ingress.extraHosts supplies one" }}
{{- end }}
{{- $new := false }}
{{- if .Capabilities.APIVersions.Has "networking.k8s.io/v1" -}}
apiVersion: networking.k8s.io/v1
{{- $new = true }}
{{- else }}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "tuwunel.labels" . | nindent 4 }}
  annotations:
    {{- if not $new }}
    kubernetes.io/ingress.class: {{ required "If ingress.enabled is set to true, ingress.class is required" .Values.ingress.class | quote }}
    {{- end }}
    {{- if .Values.ingress.annotations }}
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- end }}
spec:
  {{- if $new }}
  ingressClassName: {{ required "If ingress.enabled is set to true, ingress.class is required" .Values.ingress.class | quote }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        {{- if $includeServerName }}
        - {{ $serverNameHost }}
        {{- end }}
        {{- /* config.global.well_known.server is empty on a non-delegated
               install, so an unguarded entry here renders a null host and the
               API server refuses the Ingress with
               `spec.tls[0].hosts[1]: Invalid value: ""`. */}}
        {{- if $delegatedDomain }}
        - {{ $delegatedDomain }}
        {{- end }}
      {{- range .Values.ingress.extraHosts }}
        - {{ include "tuwunel.host" (dict "value" . "label" "ingress.extraHosts") }}
      {{- end }}
      secretName: {{ .Values.ingress.tlsSecretName | default (printf "%s-tls" $fullName) }}
  {{- end }}
  rules:
    {{- if and $isDelegatedDomain $includeServerName }}
    - host: {{ $serverNameHost }}
      http:
        paths:
          - path: "/.well-known/matrix"
            {{- if $new }}
            pathType: Prefix
            {{- end }}
            backend:
              {{- if $new }}
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $servicePort }}
              {{- else }}
              serviceName: {{ $fullName }}
              servicePort: {{ $servicePort }}
              {{- end }}
          - path: "/_matrix"
            {{- if $new }}
            pathType: Prefix
            {{- end }}
            backend:
              {{- if $new }}
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $servicePort }}
              {{- else }}
              serviceName: {{ $fullName }}
              servicePort: {{ $servicePort }}
              {{- end }}
    {{- end }}
    {{- /* The catch-all rule is the delegated domain when the deployment answers
           on one, the apex otherwise - and the apex is only there when
           includeServerName renders it. */}}
    {{- if or $isDelegatedDomain $includeServerName }}
    {{- if $isDelegatedDomain }}
    - host: {{ $delegatedDomain }}
    {{- else }}
    - host: {{ $serverNameHost }}
    {{- end }}
      http:
        paths:
          - path: {{ $ingressPath }}
            {{- if $new }}
            pathType: Prefix
            {{- end }}
            backend:
              {{- if $new }}
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $servicePort }}
              {{- else }}
              serviceName: {{ $fullName }}
              servicePort: {{ $servicePort }}
              {{- end }}
    {{- end }}
    {{- range .Values.ingress.extraHosts }}
    - host: {{ include "tuwunel.host" (dict "value" . "label" "ingress.extraHosts") }}
      http:
        paths:
          - path: {{ $ingressPath }}
            {{- if $new }}
            pathType: Prefix
            {{- end }}
            backend:
              {{- if $new }}
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $servicePort }}
              {{- else }}
              serviceName: {{ $fullName }}
              servicePort: {{ $servicePort }}
              {{- end }}
    {{- end }}
{{- end }}

