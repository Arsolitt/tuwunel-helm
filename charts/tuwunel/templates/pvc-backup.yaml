{{- if and .Values.backup.enabled (not .Values.backup.existingClaim) }}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ template "tuwunel.fullname" . }}-backup
  labels:
    {{- include "tuwunel.labels" . | nindent 4 }}
    app.kubernetes.io/component: tuwunel-backup
  {{- with .Values.pvcAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.backup.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.backup.size | quote }}
  {{- $class := .Values.backup.storageClass }}
  {{- if eq (printf "%v" $class) "-" }}
  # "-" means "no provisioner": bind a pre-created PV by hand
  storageClassName: ""
  {{- else if $class }}
  storageClassName: {{ $class | quote }}
  {{- end }}
{{- end }}
