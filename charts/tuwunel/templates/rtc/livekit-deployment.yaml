{{- if .Values.rtc.enabled -}}
{{- $livekit := .Values.rtc.livekit }}
{{- $hostNetwork := eq $livekit.networkMode "hostNetwork" }}
{{- $rtcConfig := (get $livekit.config "rtc" | default dict) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tuwunel.fullname" . }}-livekit
  labels:
    {{- include "tuwunel.labels" . | nindent 4 }}
    app.kubernetes.io/component: rtc-livekit
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      {{- include "tuwunel.labels" . | nindent 6 }}
      app.kubernetes.io/component: rtc-livekit
  template:
    metadata:
      labels:
        {{- include "tuwunel.labels" . | nindent 8 }}
        app.kubernetes.io/component: rtc-livekit
      annotations:
        # livekit.yaml only reaches the pod through the init container, so
        # without this a configuration change would never restart it.
        checksum/livekit-config: {{ include (print $.Template.BasePath "/rtc/livekit-configmap.yaml") . | sha256sum }}
        {{- with $livekit.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if $hostNetwork }}
      # hostNetwork pins the RTC endpoint to the node whose address rtc.domain
      # resolves to, which is what makes the fixed ports below reachable.
      hostNetwork: true
      # Without this a hostNetwork pod keeps the node's resolver and cannot
      # resolve the <release>-jwt Service name it posts webhooks to.
      dnsPolicy: ClusterFirstWithHostNet
      {{- else }}
      hostNetwork: false
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: config-processor
          image: "{{ .Values.initContainer.image.repository }}:{{ .Values.initContainer.image.tag }}"
          imagePullPolicy: {{ .Values.initContainer.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - envsubst < /tmp/config-template/livekit.yaml > /tmp/config/livekit.yaml
          {{- if or ($livekit.env) ($livekit.envRaw) ($livekit.envFromSecret) }}
          env:
          {{- range $key, $val := $livekit.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
          {{- end }}
          {{- if $livekit.envRaw }}
            {{- with $livekit.envRaw }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- range $key, $val := $livekit.envFromSecret }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ (split "/" $val)._0 }}
                  key: {{ (split "/" $val)._1 }}
          {{- end }}
          {{- end }}
          volumeMounts:
            - name: config-template
              mountPath: /tmp/config-template
            - name: config
              mountPath: /tmp/config
            - name: tmp
              mountPath: /tmp
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: livekit
          image: "{{ $livekit.image.repository }}:{{ $livekit.image.tag }}"
          imagePullPolicy: {{ $livekit.image.pullPolicy }}
          args: ["--config", "/tmp/config/livekit.yaml"]
          ports:
            - name: http
              containerPort: {{ $livekit.config.port }}
            {{- if (get $rtcConfig "tcp_port") }}
            - name: rtc-tcp
              containerPort: {{ get $rtcConfig "tcp_port" }}
            {{- end }}
            {{- if (get $rtcConfig "udp_port") }}
            - name: rtc-udp
              containerPort: {{ get $rtcConfig "udp_port" }}
              protocol: UDP
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /tmp/config
            - name: tmp
              mountPath: /tmp
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml $livekit.resources | nindent 12 }}
      {{- with $livekit.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $livekit.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $livekit.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config-template
          configMap:
            name: {{ include "tuwunel.fullname" . }}-livekit
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
