{{- if .Values.rtc.enabled -}}
{{/* lk-jwt-service 0.7.0 needs LIVEKIT_FULL_ACCESS_HOMESERVERS (it used to
     default to "*") and would fail every token request without it, so all three
     of these are derived from the chart's own values and only left alone when
     the user set them explicitly. */}}
{{- $env := deepCopy .Values.rtc.jwt.env }}
{{- if not (hasKey $env "LIVEKIT_URL") }}{{ $_ := set $env "LIVEKIT_URL" (printf "wss://%s" .Values.rtc.domain) }}{{ end }}
{{- if not (hasKey $env "LIVEKIT_FULL_ACCESS_HOMESERVERS") }}{{ $_ := set $env "LIVEKIT_FULL_ACCESS_HOMESERVERS" .Values.server_name }}{{ end }}
{{- if not (hasKey $env "LIVEKIT_JWT_BIND") }}{{ $_ := set $env "LIVEKIT_JWT_BIND" ":8080" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tuwunel.fullname" . }}-jwt
  labels:
    {{- include "tuwunel.labels" . | nindent 4 }}
    app.kubernetes.io/component: rtc-jwt
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "tuwunel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rtc-jwt
  template:
    metadata:
      labels:
        {{- include "tuwunel.labels" . | nindent 8 }}
        app.kubernetes.io/component: rtc-jwt
      {{- with .Values.rtc.jwt.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jwt-service
          image: "{{ .Values.rtc.jwt.image.repository }}:{{ .Values.rtc.jwt.image.tag }}"
          imagePullPolicy: {{ .Values.rtc.jwt.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- range $key, $val := $env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- if .Values.rtc.jwt.envRaw }}
            {{- with .Values.rtc.jwt.envRaw }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- range $key, $val := .Values.rtc.jwt.envFromSecret }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ (split "/" $val)._0 }}
                  key: {{ (split "/" $val)._1 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - mountPath: /tmp
              name: tmp
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.rtc.jwt.resources | nindent 12 }}
      {{- with .Values.rtc.jwt.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.rtc.jwt.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.rtc.jwt.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
