{{- if and .Values.rtc.enabled .Values.rtc.ingress.enabled -}}
{{- $fullName := include "tuwunel.fullname" . -}}
{{- $class := .Values.rtc.ingress.class | default .Values.ingress.class -}}
{{- $jwtPaths := list "/get_token" "/sfu/get" "/healthz" "/delegate_delayed_leave" "/sfu_webhook" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-rtc
  labels:
    {{- include "tuwunel.labels" . | nindent 4 }}
    app.kubernetes.io/component: rtc-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/websocket-services: {{ $fullName }}-livekit
    # WebRTC signalling and the SFU websocket are long-lived; buffering them
    # adds latency to every call setup.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    {{- with .Values.rtc.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if $class }}
  ingressClassName: {{ $class | quote }}
  {{- end }}
  {{- if .Values.rtc.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.rtc.domain }}
      secretName: {{ .Values.rtc.ingress.tlsSecretName | default (printf "%s-rtc-tls" $fullName) }}
  {{- end }}
  rules:
    - host: {{ .Values.rtc.domain }}
      http:
        paths:
          {{- range $jwtPaths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-jwt
                port:
                  number: 8080
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-livekit
                port:
                  number: {{ .Values.rtc.livekit.config.port }}
{{- end }}
