# Scenario: Matrix RTC (Element Call) enabled with LiveKit and the JWT service.
#
# Exercises the rtc/* templates: both sidecar deployments and services, the
# LiveKit configmap with envsubst placeholders, secret-sourced env vars and the
# RTC ingress.
server_name: matrix.ci.example

rtc:
  enabled: true
  domain: rtc.ci.example

  jwt:
    env:
      LIVEKIT_URL: wss://rtc.ci.example
      LIVEKIT_FULL_ACCESS_HOMESERVERS: matrix.ci.example
    envFromSecret:
      LIVEKIT_KEY: livekit-secrets/LIVEKIT_KEY
      LIVEKIT_SECRET: livekit-secrets/LIVEKIT_SECRET

  livekit:
    envFromSecret:
      LIVEKIT_KEY: livekit-secrets/LIVEKIT_KEY
      LIVEKIT_SECRET: livekit-secrets/LIVEKIT_SECRET
    config:
      keys:
        "${LIVEKIT_KEY}": "${LIVEKIT_SECRET}"

  ingress:
    enabled: true
    class: nginx
    tls: true
    tlsSecretName: rtc-ci-tls
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod

config:
  global:
    well_known:
      rtc_transports:
        - type: livekit
          livekit_service_url: https://rtc.ci.example
