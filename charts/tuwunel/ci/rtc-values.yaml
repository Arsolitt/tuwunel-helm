# Scenario: Matrix RTC (Element Call) enabled with LiveKit and the JWT service.
#
# Exercises the rtc/* templates: both sidecar deployments and services, the
# LiveKit configmap, secret-sourced env vars and the RTC ingress. Everything the
# chart is supposed to derive is deliberately left unset: no well_known block
# (livekit_url is injected), no LIVEKIT_URL / LIVEKIT_FULL_ACCESS_HOMESERVERS /
# LIVEKIT_JWT_BIND, no livekit.config.keys, no networkMode (hostNetwork default).
server_name: matrix.ci.example

rtc:
  enabled: true
  domain: rtc.ci.example

  jwt:
    envFromSecret:
      LIVEKIT_KEY: livekit-secrets/LIVEKIT_KEY
      LIVEKIT_SECRET: livekit-secrets/LIVEKIT_SECRET

  livekit:
    envFromSecret:
      LIVEKIT_KEY: livekit-secrets/LIVEKIT_KEY
      LIVEKIT_SECRET: livekit-secrets/LIVEKIT_SECRET

  ingress:
    enabled: true
    class: nginx
    tls: true
    tlsSecretName: rtc-ci-tls
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod

config:
  global:
    allow_federation: false
