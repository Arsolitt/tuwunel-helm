# Single pipeline for the chart: quality gate on pull requests, release on main.
#
# Job ids are the status-check contexts (`lint`, `schema`, `runtime`, `release`);
# the first three are meant to be required on pull requests. There is
# deliberately no `paths:` filter on `pull_request` - a job skipped by a path
# filter never reports a status, so requiring it would block every merge that
# does not touch those paths.
#
#   lint     renders the chart defaults and every ci/*-values.yaml fixture and
#            validates each render against the Kubernetes schemas, plus the
#            Gateway API kinds the chart can render (kubeconform ships none of
#            that group's schemas; they come from a pinned catalog commit).
#   schema   proves ci/invalid/*.yaml is refused by values.schema.json and
#            ci/invalid-render/*.yaml is refused by the template that owns the
#            cross-value rule, so neither guardrail can be dropped silently.
#   runtime  starts the real image on every fixture (see hack/runtime-check.sh).
#   release  runs on main: chart-releaser publishes any chart version that is not
#            released yet, then the released version's CHANGELOG.md section
#            becomes the GitHub release body.
#
# Tool pins live in `env:` below; Dependabot keeps the actions themselves fresh.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # One pin per tool, no `@latest` anywhere; Dependabot bumps the actions below.
  HELM_VERSION: 4.3.0
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  # JSON schemas for the Gateway API kinds the chart can render. kubeconform has
  # no built-in schema for that group and -strict fails on a missing one, so the
  # files are fetched from a pinned catalog commit and checksum-verified.
  CRDS_CATALOG_SHA: ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2
  HTTPROUTE_SCHEMA_SHA256: e5692e62edd9b8a14bd2527d0a732e174a649131aa4d47159737dc6527c59ca5
  UDPROUTE_SCHEMA_SHA256: d624dc44db2eb4dfedcd02a137b7dd1ceabd11d9670335a90727b340b667e5d9
  TCPROUTE_SCHEMA_SHA256: 91b0188d2b7b0552c462e1fc7dd531b735013e8762d725fdc1e42e49e4bf4418
  CHART_RELEASER_VERSION: v1.8.1
  # Oldest and newest Kubernetes releases the rendered manifests are checked
  # against. kubeconform fetches these schemas from yannh/kubernetes-json-schema.
  KUBERNETES_VERSIONS: 1.31.0 1.37.0
  CHART_DIR: charts/tuwunel

jobs:
  lint:
    name: Lint and validate manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -fsSLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          helm version --short
          kubeconform -v

      # kubeconform carries no schema for gateway.networking.k8s.io and -strict
      # turns a missing schema into a failure, so the kinds this chart can render
      # are fetched from a pinned CRDs-catalog commit and checksum-verified.
      # kubeconform lower-cases the kind when it builds the file name, which is
      # why the names below are the ones it looks for.
      - name: Fetch Gateway API schemas
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gateway-api"
          for pair in "httproute:$HTTPROUTE_SCHEMA_SHA256" \
                      "udproute:$UDPROUTE_SCHEMA_SHA256" \
                      "tcproute:$TCPROUTE_SCHEMA_SHA256"; do
            name="${pair%%:*}"
            want="${pair##*:}"
            curl -fsSLo "$RUNNER_TEMP/gateway-api/${name}_v1.json" \
              "https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRDS_CATALOG_SHA}/gateway.networking.k8s.io/${name}_v1.json"
            echo "${want}  $RUNNER_TEMP/gateway-api/${name}_v1.json" | sha256sum -c -
          done

      # values.schema.json is applied by every helm command, so lint failures
      # here cover both template shape and chart-level value validation.
      - name: helm lint
        run: |
          set -euo pipefail
          helm lint --strict "$CHART_DIR"
          for values in "$CHART_DIR"/ci/*-values.yaml; do
            echo "::group::helm lint --strict -f $values"
            helm lint --strict "$CHART_DIR" -f "$values"
            echo "::endgroup::"
          done

      - name: Render and check against Kubernetes schemas
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/tuwunel-manifests.yaml"
          validate() {
            local label="$1"
            shift
            for k8s in $KUBERNETES_VERSIONS; do
              echo "::group::$label on Kubernetes $k8s"
              # Render to a .yaml file before validating: kubeconform keys off
              # the file extension, and input it does not recognise is reported
              # as "0 resource found" with exit code 0 - a silent no-op.
              helm template ci "$CHART_DIR" "$@" > "$manifest"
              expected=$(grep -c '^kind:' "$manifest" || true)
              if [ "$expected" -eq 0 ]; then
                echo "::error::$label rendered no resources"
                exit 1
              fi
              summary=$(kubeconform -strict -summary -kubernetes-version "$k8s" \
                -schema-location default \
                -schema-location "$RUNNER_TEMP/gateway-api/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
                "$manifest")
              echo "$summary"
              if ! grep -qE "Summary: $expected resources? found" <<<"$summary"; then
                echo "::error::$label: kubeconform validated an unexpected number of resources (rendered $expected)"
                exit 1
              fi
              # A skipped resource is a kind with no schema - the check above
              # would still pass, so it is worth its own failure: without it a
              # new CRD kind would be rendered and never validated.
              if ! grep -q 'Skipped: 0' <<<"$summary"; then
                echo "::error::$label: kubeconform skipped resources, so a kind has no schema (add it to the pinned set)"
                exit 1
              fi
              echo "::endgroup::"
            done
          }
          # The defaults are a supported install too, and they are what most
          # users get: chart-releaser publishes this chart as-is, so validating
          # only the fixtures would leave the published configuration unchecked.
          validate "default values"
          for values in "$CHART_DIR"/ci/*-values.yaml; do
            validate "$(basename "$values")" -f "$values"
          done

      # kubeconform cannot see this defect: `service.type: LoadBalancer` and the
      # default `clusterIP: None` are each schema-valid, and only the
      # combination is impossible (`None` is legal on a ClusterIP Service only -
      # an unconditional render makes LoadBalancer/NodePort unapplyable), so the
      # combination is asserted on the render. The headless default is asserted
      # with it: it is what the StatefulSet needs, so a condition that dropped
      # the field everywhere would have to fail here.
      - name: Service types render an applyable clusterIP
        run: |
          set -euo pipefail
          headless="${RUNNER_TEMP}/tuwunel-service-headless.yaml"
          balancer="${RUNNER_TEMP}/tuwunel-service-loadbalancer.yaml"
          helm template ci "$CHART_DIR" > "$headless"
          helm template ci "$CHART_DIR" -f "$CHART_DIR/ci/service-loadbalancer-values.yaml" > "$balancer"
          if ! grep -q '^  clusterIP: "None"$' "$headless"; then
            echo "::error::the default render lost the headless clusterIP the StatefulSet needs"
            exit 1
          fi
          if grep -q '^  clusterIP:' "$balancer"; then
            echo "::error::a LoadBalancer Service rendered a clusterIP, which the API server only accepts as 'None' on a ClusterIP Service"
            exit 1
          fi
          if ! grep -q '^  type: LoadBalancer$' "$balancer"; then
            echo "::error::service-loadbalancer-values.yaml did not render type: LoadBalancer"
            exit 1
          fi
          echo "headless default kept; the LoadBalancer render has no clusterIP"

      # kubeconform cannot see an empty host either: the schema types every
      # entry as a string, and the render's bare `- ` becomes null - which the
      # API server refuses (`spec.tls[0].hosts[1]: Invalid value: ""`). The
      # host lists the templates build from values are parsed out of the render
      # and required to hold non-empty names, so a condition that lets an unset
      # value through has to fail here.
      - name: Rendered host lists carry no empty entries
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/tuwunel-hosts.yaml"
          check() {
            local label="$1"
            shift
            helm template ci "$CHART_DIR" "$@" > "$manifest"
            python3 - "$manifest" "$label" <<'PY'
          import re
          import sys
          import yaml

          path, label = sys.argv[1], sys.argv[2]
          # A host field the API server accepts is an RFC 1123 subdomain, with a
          # wildcard prefix allowed; a port, a scheme or an empty entry is not.
          host_re = re.compile(r"^(\*\.)?[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$")
          empty = []

          def check(where, value):
              if not isinstance(value, str) or not host_re.match(value):
                  empty.append(f"{label}: {where} is not a hostname ({value!r})")

          for doc in yaml.safe_load_all(open(path)):
              if not isinstance(doc, dict):
                  continue
              name = (doc.get("metadata") or {}).get("name", "?")
              kind, spec = doc.get("kind"), doc.get("spec") or {}
              if kind == "Ingress":
                  for i, tls in enumerate(spec.get("tls") or []):
                      for j, host in enumerate((tls or {}).get("hosts") or []):
                          check(f"Ingress/{name} spec.tls[{i}].hosts[{j}]", host)
                  for i, rule in enumerate(spec.get("rules") or []):
                      if rule and "host" in rule:
                          check(f"Ingress/{name} spec.rules[{i}].host", rule.get("host"))
              elif kind in ("HTTPRoute", "UDPRoute", "TCPRoute"):
                  for j, host in enumerate(spec.get("hostnames") or []):
                      check(f"{kind}/{name} spec.hostnames[{j}]", host)
          if empty:
              for entry in empty:
                  print(f"::error::a host field the API server refuses is rendered - {entry}")
              sys.exit(1)
          PY
          }
          check "default values"
          for values in "$CHART_DIR"/ci/*-values.yaml; do
            check "$(basename "$values")" -f "$values"
          done
          echo "no empty hosts in any render"

      # An immutable field cannot be seen in a single render: `spec.selector` of
      # a workload accepts the chart-version label the same way it accepts any
      # other, and only the *next* chart release discovers that the API server
      # refuses to change it (`spec.selector: Invalid value: ...: field is
      # immutable` - chart 2.0.1 shipped exactly that, so every upgrade of every
      # release it created failed). The two properties that keep it applyable are
      # checked on every render instead: a selector carries no label that moves
      # with the chart version, and the workload's own pod template carries
      # everything its selector asks for. Services are held to the first one as
      # well - their selector is mutable, but a chart-version label in it drops
      # every endpoint of the old pods the moment the new chart is applied.
      - name: Selectors are immutable and select their own pods
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/tuwunel-selectors.yaml"
          check() {
            local label="$1"
            shift
            helm template ci "$CHART_DIR" "$@" > "$manifest"
            python3 hack/selector-check.py "$manifest" "$label"
          }
          check "default values"
          for values in "$CHART_DIR"/ci/*-values.yaml; do
            check "$(basename "$values")" -f "$values"
          done

  schema:
    name: Value schema guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      # The schema is only worth having if it still refuses impossible values:
      # weakening it (or dropping it) has to break this job, not pass silently.
      - name: Impossible values must be rejected
        run: |
          set -euo pipefail
          shopt -s nullglob
          fixtures=("$CHART_DIR"/ci/invalid/*.yaml)
          if [ "${#fixtures[@]}" -eq 0 ]; then
            echo "::error::no fixtures under $CHART_DIR/ci/invalid/ - this check would pass without validating anything"
            exit 1
          fi
          status=0
          for values in "${fixtures[@]}"; do
            if out=$(helm template ci "$CHART_DIR" -f "$values" 2>&1); then
              echo "::error file=$values::$values was accepted, but it must be rejected by $CHART_DIR/values.schema.json"
              status=1
            elif ! grep -qi schema <<<"$out"; then
              echo "::error file=$values::$values failed for an unexpected reason (not schema validation):"
              echo "$out"
              status=1
            else
              echo "rejected as expected: $values"
            fi
          done
          exit $status

      # Not every impossible value is a schema question: the port that the
      # chart writes into TUWUNEL_PORT has to agree with service.port, and a
      # UDP port *range* cannot go through a Service - those are cross-value
      # rules the schema cannot express, so a template refuses them. The
      # refusal has to be the template's own and it has to name the value that
      # caused it, which every fixture declares in an `# expect-error:` line.
      - name: Values the templates must refuse
        run: |
          set -euo pipefail
          shopt -s nullglob
          fixtures=("$CHART_DIR"/ci/invalid-render/*.yaml)
          if [ "${#fixtures[@]}" -eq 0 ]; then
            echo "::error::no fixtures under $CHART_DIR/ci/invalid-render/ - this check would pass without validating anything"
            exit 1
          fi
          status=0
          for values in "${fixtures[@]}"; do
            expected=$(sed -n 's/^# expect-error: //p' "$values")
            if [ -z "$expected" ]; then
              echo "::error file=$values::$values has no '# expect-error: <substring>' line naming the value the render must report"
              status=1
              continue
            fi
            if out=$(helm template ci "$CHART_DIR" -f "$values" 2>&1); then
              echo "::error file=$values::$values rendered, but a template has to refuse it ($expected)"
              status=1
              continue
            fi
            if grep -qi schema <<<"$out"; then
              echo "::error file=$values::$values was rejected by values.schema.json, not by the template that owns the rule ($expected):"
              echo "$out"
              status=1
              continue
            fi
            if ! grep -qF "$expected" <<<"$out"; then
              echo "::error file=$values::$values was refused without naming '$expected':"
              echo "$out"
              status=1
              continue
            fi
            echo "refused by a template as expected: $values ($expected)"
          done
          exit $status

      - name: Supported value shapes must keep working
        run: |
          set -euo pipefail
          for values in "$CHART_DIR"/ci/*-values.yaml; do
            helm template ci "$CHART_DIR" -f "$values" > /dev/null
            echo "rendered: $values"
          done

  # The other jobs only prove the manifests have the right *shape*. `helm lint`,
  # `kubeconform` and values.schema.json never read the rendered config.toml,
  # and no schema says anything about the readiness path - yet both decide
  # whether tuwunel starts at all: a config value of the wrong TOML type
  # (`allow_federation = "false"` instead of `= false`) makes the process exit 1
  # at startup, and a path that answers 403 while federation is disabled leaves
  # the pod permanently NotReady. This job is the only gate that starts the real
  # image on every fixture, and it drives it with what that fixture renders: the
  # init container runs envsubst to produce the config the server really reads,
  # the probe command from the manifest itself is executed, the readiness URL is
  # the one the `helm test` pod uses, and a config that asks for online backups
  # gets the crontab's SIGUSR2 and has to produce a repository - so a path or a
  # name that only exists in the chart's own assumptions fails here.
  runtime:
    name: Runtime smoke test against the real image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      # Every fixture now runs the init container, an exec probe and the
      # readiness request; the container is removed after every fixture and by
      # the script's trap, so a leak can never mask the next one.
      - name: Start the image and probe it the way the manifests say
        run: hack/runtime-check.sh "$CHART_DIR"

  release:
    name: Release chart
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, schema, runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      # Packages every chart whose version is not released yet, creates the
      # `<chart>-<version>` tag and GitHub release, and updates the index.yaml
      # published by the gh-pages branch. A chart version that is already
      # released is skipped, so doc-only merges are a no-op. The releases it
      # creates carry the chart `description` as their body; the next step
      # replaces that with the chart's CHANGELOG.md section.
      - name: Run chart-releaser
        id: release
        uses: helm/chart-releaser-action@v1.7.0
        with:
          version: ${{ env.CHART_RELEASER_VERSION }}
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The release body has to come from the repository, and chart-releaser
      # cannot carry it: chart-releaser-action@v1.7.0 has no notes input, and
      # `cr upload` reads `--release-notes-file` only from inside the packaged
      # chart. So the body is edited in after the release exists, from
      # CHANGELOG.md - the `## [<version>]` section of the version that was just
      # released, plus a compare link. A released version without that section
      # fails this step, and the job, rather than publishing a release whose
      # body silently stayed the chart description.
      - name: Publish release notes
        if: steps.release.outputs.changed_charts != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED_CHARTS: ${{ steps.release.outputs.changed_charts }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          trap 'rm -f "$notes"' EXIT
          # `changed_charts` is a comma-separated list of chart directories
          # (cr.sh writes it with IFS=,), and an empty string when no version
          # changed - which is what the `if:` above filters out, repeated here so
          # the block is a no-op when run by hand too (and because `"${charts[@]}"`
          # on an empty array trips `set -u` before bash 4.4). The action's other
          # output is not usable here: `chart_version` is the *previous* tag
          # (`git describe --tags --abbrev=0 HEAD~`), so the released version is
          # read back from each chart's Chart.yaml.
          if [ -n "$CHANGED_CHARTS" ]; then
            IFS=',' read -ra charts <<<"$CHANGED_CHARTS"
            for chart_dir in "${charts[@]}"; do
              [ -n "$chart_dir" ] || continue
              name=$(awk '/^name:/ { print $2; exit }' "$chart_dir/Chart.yaml")
              version=$(awk '/^version:/ { print $2; exit }' "$chart_dir/Chart.yaml")
              tag="${name}-${version}"
              hack/release-notes.sh "$version" > "$notes"
              gh release edit "$tag" --notes-file "$notes"
              echo "::notice::$tag published with the release notes from CHANGELOG.md"
            done
          fi

      - name: Summarize
        env:
          CHANGED_CHARTS: ${{ steps.release.outputs.changed_charts }}
        run: |
          set -euo pipefail
          {
            echo "### Chart release"
            if [ -n "$CHANGED_CHARTS" ]; then
              echo "Published: \`${CHANGED_CHARTS}\`"
            else
              echo "No chart version change detected - nothing was published."
              echo "Bump \`version\` in \`${CHART_DIR}/Chart.yaml\` to publish a release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
