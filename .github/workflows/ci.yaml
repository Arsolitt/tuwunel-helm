# Single pipeline for the chart: quality gate on every change, release on a tag.
#
# Job ids are the status-check contexts (`lint`, `schema`, `runtime`,
# `release-tag`, `release`); the first three are meant to be required on pull
# requests. There is deliberately no `paths:` filter on `pull_request` - a job
# skipped by a path filter never reports a status, so requiring it would block
# every merge that does not touch those paths.
#
#   lint         renders the chart defaults and every ci/*-values.yaml fixture and
#                validates each render against the Kubernetes schemas, plus the
#                Gateway API kinds the chart can render (kubeconform ships none
#                of that group's schemas; they come from a pinned catalog commit).
#   schema       proves ci/invalid/*.yaml is refused by values.schema.json and
#                ci/invalid-render/*.yaml is refused by the template that owns
#                the cross-value rule, so neither guardrail can be dropped
#                silently.
#   runtime      starts the real image on every fixture (see hack/runtime-check.sh).
#
# Those three run on pull requests, on pushes to main and on release tags: a tag
# is released by the same gates the branch is held to.
#
#   release-tag  runs on a `release-*` tag: the version is either
#                `<major>.<minor>.<patch>` (the stable track) or
#                `<major>.<minor>.<patch>-rc.<n>` (the release candidate track),
#                the CHANGELOG.md section the release body comes from has to
#                exist, and the tagged commit has to be on main. It fails in
#                seconds, before the ~25-minute runtime gate starts.
#   release      runs on a tag, after those gates: the chart is packaged with the
#                tag's version stamped into it (`helm package --version`), the
#                release and the gh-pages index entry are published under the
#                tag that already exists, the GitHub release body becomes the
#                tag version's `## [<version>]` CHANGELOG.md section (a
#                candidate uses the section of the version it is a candidate of
#                and is flagged pre-release), and main then records the version
#                in Chart.yaml.
#
# Tool pins live in `env:` below; Dependabot keeps the actions themselves fresh.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'release-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # One pin per tool, no `@latest` anywhere; Dependabot bumps the actions below.
  HELM_VERSION: 4.3.0
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  # JSON schemas for the Gateway API kinds the chart can render. kubeconform has
  # no built-in schema for that group and -strict fails on a missing one, so the
  # files are fetched from a pinned catalog commit and checksum-verified.
  CRDS_CATALOG_SHA: ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2
  HTTPROUTE_SCHEMA_SHA256: e5692e62edd9b8a14bd2527d0a732e174a649131aa4d47159737dc6527c59ca5
  UDPROUTE_SCHEMA_SHA256: d624dc44db2eb4dfedcd02a137b7dd1ceabd11d9670335a90727b340b667e5d9
  TCPROUTE_SCHEMA_SHA256: 91b0188d2b7b0552c462e1fc7dd531b735013e8762d725fdc1e42e49e4bf4418
  CHART_RELEASER_VERSION: v1.8.1
  # Oldest and newest Kubernetes releases the rendered manifests are checked
  # against. kubeconform fetches these schemas from yannh/kubernetes-json-schema.
  KUBERNETES_VERSIONS: 1.31.0 1.37.0
  CHART_DIR: charts/tuwunel

jobs:
  lint:
    name: Lint and validate manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -fsSLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          helm version --short
          kubeconform -v

      # kubeconform carries no schema for gateway.networking.k8s.io and -strict
      # turns a missing schema into a failure, so the kinds this chart can render
      # are fetched from a pinned CRDs-catalog commit and checksum-verified.
      # kubeconform lower-cases the kind when it builds the file name, which is
      # why the names below are the ones it looks for.
      - name: Fetch Gateway API schemas
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gateway-api"
          for pair in "httproute:$HTTPROUTE_SCHEMA_SHA256" \
                      "udproute:$UDPROUTE_SCHEMA_SHA256" \
                      "tcproute:$TCPROUTE_SCHEMA_SHA256"; do
            name="${pair%%:*}"
            want="${pair##*:}"
            curl -fsSLo "$RUNNER_TEMP/gateway-api/${name}_v1.json" \
              "https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRDS_CATALOG_SHA}/gateway.networking.k8s.io/${name}_v1.json"
            echo "${want}  $RUNNER_TEMP/gateway-api/${name}_v1.json" | sha256sum -c -
          done

      # values.schema.json is applied by every helm command, so lint failures
      # here cover both template shape and chart-level value validation.
      - name: helm lint
        run: |
          set -euo pipefail
          helm lint --strict "$CHART_DIR"
          for values in "$CHART_DIR"/ci/*-values.yaml; do
            echo "::group::helm lint --strict -f $values"
            helm lint --strict "$CHART_DIR" -f "$values"
            echo "::endgroup::"
          done

      - name: Render and check against Kubernetes schemas
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/tuwunel-manifests.yaml"
          validate() {
            local label="$1"
            shift
            for k8s in $KUBERNETES_VERSIONS; do
              echo "::group::$label on Kubernetes $k8s"
              # Render to a .yaml file before validating: kubeconform keys off
              # the file extension, and input it does not recognise is reported
              # as "0 resource found" with exit code 0 - a silent no-op.
              helm template ci "$CHART_DIR" "$@" > "$manifest"
              expected=$(grep -c '^kind:' "$manifest" || true)
              if [ "$expected" -eq 0 ]; then
                echo "::error::$label rendered no resources"
                exit 1
              fi
              summary=$(kubeconform -strict -summary -kubernetes-version "$k8s" \
                -schema-location default \
                -schema-location "$RUNNER_TEMP/gateway-api/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
                "$manifest")
              echo "$summary"
              if ! grep -qE "Summary: $expected resources? found" <<<"$summary"; then
                echo "::error::$label: kubeconform validated an unexpected number of resources (rendered $expected)"
                exit 1
              fi
              # A skipped resource is a kind with no schema - the check above
              # would still pass, so it is worth its own failure: without it a
              # new CRD kind would be rendered and never validated.
              if ! grep -q 'Skipped: 0' <<<"$summary"; then
                echo "::error::$label: kubeconform skipped resources, so a kind has no schema (add it to the pinned set)"
                exit 1
              fi
              echo "::endgroup::"
            done
          }
          # The defaults are a supported install too, and they are what most
          # users get: the release job packages the tagged tree as-is, so
          # validating only the fixtures would leave the published
          # configuration unchecked.
          validate "default values"
          for values in "$CHART_DIR"/ci/*-values.yaml; do
            validate "$(basename "$values")" -f "$values"
          done

      # kubeconform cannot see this defect: `service.type: LoadBalancer` and the
      # default `clusterIP: None` are each schema-valid, and only the
      # combination is impossible (`None` is legal on a ClusterIP Service only -
      # an unconditional render makes LoadBalancer/NodePort unapplyable), so the
      # combination is asserted on the render. The headless default is asserted
      # with it: it is what the StatefulSet needs, so a condition that dropped
      # the field everywhere would have to fail here.
      - name: Service types render an applyable clusterIP
        run: |
          set -euo pipefail
          headless="${RUNNER_TEMP}/tuwunel-service-headless.yaml"
          balancer="${RUNNER_TEMP}/tuwunel-service-loadbalancer.yaml"
          helm template ci "$CHART_DIR" > "$headless"
          helm template ci "$CHART_DIR" -f "$CHART_DIR/ci/service-loadbalancer-values.yaml" > "$balancer"
          if ! grep -q '^  clusterIP: "None"$' "$headless"; then
            echo "::error::the default render lost the headless clusterIP the StatefulSet needs"
            exit 1
          fi
          if grep -q '^  clusterIP:' "$balancer"; then
            echo "::error::a LoadBalancer Service rendered a clusterIP, which the API server only accepts as 'None' on a ClusterIP Service"
            exit 1
          fi
          if ! grep -q '^  type: LoadBalancer$' "$balancer"; then
            echo "::error::service-loadbalancer-values.yaml did not render type: LoadBalancer"
            exit 1
          fi
          echo "headless default kept; the LoadBalancer render has no clusterIP"

      # kubeconform cannot see an empty host either: the schema types every
      # entry as a string, and the render's bare `- ` becomes null - which the
      # API server refuses (`spec.tls[0].hosts[1]: Invalid value: ""`). The
      # host lists the templates build from values are parsed out of the render
      # and required to hold non-empty names, so a condition that lets an unset
      # value through has to fail here.
      - name: Rendered host lists carry no empty entries
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/tuwunel-hosts.yaml"
          check() {
            local label="$1"
            shift
            helm template ci "$CHART_DIR" "$@" > "$manifest"
            python3 - "$manifest" "$label" <<'PY'
          import re
          import sys
          import yaml

          path, label = sys.argv[1], sys.argv[2]
          # A host field the API server accepts is an RFC 1123 subdomain, with a
          # wildcard prefix allowed; a port, a scheme or an empty entry is not.
          host_re = re.compile(r"^(\*\.)?[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$")
          empty = []

          def check(where, value):
              if not isinstance(value, str) or not host_re.match(value):
                  empty.append(f"{label}: {where} is not a hostname ({value!r})")

          for doc in yaml.safe_load_all(open(path)):
              if not isinstance(doc, dict):
                  continue
              name = (doc.get("metadata") or {}).get("name", "?")
              kind, spec = doc.get("kind"), doc.get("spec") or {}
              if kind == "Ingress":
                  for i, tls in enumerate(spec.get("tls") or []):
                      for j, host in enumerate((tls or {}).get("hosts") or []):
                          check(f"Ingress/{name} spec.tls[{i}].hosts[{j}]", host)
                  for i, rule in enumerate(spec.get("rules") or []):
                      if rule and "host" in rule:
                          check(f"Ingress/{name} spec.rules[{i}].host", rule.get("host"))
              elif kind in ("HTTPRoute", "UDPRoute", "TCPRoute"):
                  for j, host in enumerate(spec.get("hostnames") or []):
                      check(f"{kind}/{name} spec.hostnames[{j}]", host)
          if empty:
              for entry in empty:
                  print(f"::error::a host field the API server refuses is rendered - {entry}")
              sys.exit(1)
          PY
          }
          check "default values"
          for values in "$CHART_DIR"/ci/*-values.yaml; do
            check "$(basename "$values")" -f "$values"
          done
          echo "no empty hosts in any render"

      # No schema can see this one: includeServerName is a plain boolean and
      # server_name a plain string, and the same values are valid with either
      # boolean - only the combination decides which hosts reach the manifest.
      # Both directions are asserted on the render instead. The chart's
      # both-paths fixture has to carry the normalised server_name in every host
      # field, so a condition that dropped the entry everywhere cannot pass; the
      # excluded fixture has to carry it in none while the delegated host stays
      # in all three, so the exclusion cannot pass by rendering an empty list.
      - name: The server_name host is rendered unless it is excluded
        run: |
          set -euo pipefail
          included="${RUNNER_TEMP}/tuwunel-server-name-included.yaml"
          excluded="${RUNNER_TEMP}/tuwunel-server-name-excluded.yaml"
          check() {
            local label="$1" manifest="$2"
            shift 2
            helm template ci "$CHART_DIR" "$@" > "$manifest"
            echo "rendered $label"
          }
          check "ci/server-name-with-port-values.yaml" "$included" \
            -f "$CHART_DIR/ci/server-name-with-port-values.yaml"
          check "ci/server-name-excluded-values.yaml" "$excluded" \
            -f "$CHART_DIR/ci/server-name-excluded-values.yaml"
          python3 - "$included" "$excluded" <<'PY'
          import sys
          import yaml

          included, excluded = sys.argv[1], sys.argv[2]


          def host_fields(path):
              """The host fields the chart renders, the same way the step above
              reads them: Ingress rule hosts and TLS hosts, Gateway API route
              hostnames."""
              rules, tls, hostnames = [], [], []
              for doc in yaml.safe_load_all(open(path)):
                  if not isinstance(doc, dict):
                      continue
                  kind, spec = doc.get("kind"), doc.get("spec") or {}
                  if kind == "Ingress":
                      rules += [(rule or {}).get("host") for rule in spec.get("rules") or []]
                      for entry in spec.get("tls") or []:
                          tls += (entry or {}).get("hosts") or []
                  elif kind in ("HTTPRoute", "UDPRoute", "TCPRoute"):
                      hostnames += spec.get("hostnames") or []
              return rules, tls, hostnames


          failures = []


          def require(condition, message):
              if not condition:
                  failures.append(message)


          # server-name-with-port-values.yaml: server_name carries a port, so
          # the entry that has to reach every host field is the normalised one.
          rules, tls, hostnames = host_fields(included)
          require("matrix.ci.example" in rules,
                  "ci/server-name-with-port-values.yaml: the normalised server_name is in no Ingress rule host")
          require("matrix.ci.example" in tls,
                  "ci/server-name-with-port-values.yaml: the normalised server_name is in no Ingress TLS host list")
          require("matrix.ci.example" in hostnames,
                  "ci/server-name-with-port-values.yaml: the normalised server_name is in no HTTPRoute hostname list")

          # server-name-excluded-values.yaml: the apex in none of the three, the
          # delegated host in all three.
          rules, tls, hostnames = host_fields(excluded)
          require("ci.example" not in rules,
                  "ci/server-name-excluded-values.yaml: includeServerName=false still renders ci.example in an Ingress rule host")
          require("ci.example" not in tls,
                  "ci/server-name-excluded-values.yaml: includeServerName=false still renders ci.example in an Ingress TLS host list")
          require("ci.example" not in hostnames,
                  "ci/server-name-excluded-values.yaml: includeServerName=false still renders ci.example in an HTTPRoute hostname list")
          require("matrix.ci.example" in rules,
                  "ci/server-name-excluded-values.yaml: the delegated host is in no Ingress rule host")
          require("matrix.ci.example" in tls,
                  "ci/server-name-excluded-values.yaml: the delegated host is in no Ingress TLS host list")
          require("matrix.ci.example" in hostnames,
                  "ci/server-name-excluded-values.yaml: the delegated host is in no HTTPRoute hostname list")

          for failure in failures:
              print(f"::error::{failure}")
          if failures:
              sys.exit(1)
          PY
          echo "server_name is rendered unless includeServerName excludes it"

      # No schema can express this either: serverNameWellKnownOnly is a plain
      # boolean and both layouts are valid manifests - the same Ingress accepts
      # a rule with one path or two, and a Gateway accepts both routes either
      # way - so only the value decides which one is rendered. The fixture is
      # rendered both ways and each layout asserted on the render, so a
      # condition that dropped /_matrix everywhere, or that let the apex route
      # claim the apex root, has to fail here.
      - name: The apex serves only the well-known documents when it is narrowed
        run: |
          set -euo pipefail
          fixture="$CHART_DIR/ci/server-name-well-known-only-values.yaml"
          narrowed="${RUNNER_TEMP}/tuwunel-well-known-only.yaml"
          widened="${RUNNER_TEMP}/tuwunel-well-known-wide.yaml"
          helm template ci "$CHART_DIR" -f "$fixture" > "$narrowed"
          helm template ci "$CHART_DIR" -f "$fixture" --set serverNameWellKnownOnly=false > "$widened"
          python3 - "$narrowed" "$widened" <<'PY'
          import sys
          import yaml

          narrowed, widened = sys.argv[1], sys.argv[2]
          fixture = "ci/server-name-well-known-only-values.yaml"
          APEX = "ci.example"
          DELEGATED = "matrix.ci.example"
          DISCOVERY = "/.well-known/matrix"


          def docs(path):
              """The rendered objects, in the order the chart emits them."""
              return [doc for doc in yaml.safe_load_all(open(path)) if isinstance(doc, dict)]


          def ingress_paths(manifests, host):
              """The path set of the rule that serves one host."""
              for doc in manifests:
                  if doc.get("kind") != "Ingress":
                      continue
                  for rule in (doc.get("spec") or {}).get("rules") or []:
                      if rule.get("host") == host:
                          return [path.get("path") for path in ((rule.get("http") or {}).get("paths") or [])]
              return None


          def service(manifests):
              """The name and port of the Service every route points at."""
              for doc in manifests:
                  if doc.get("kind") == "Service":
                      ports = (doc.get("spec") or {}).get("ports") or []
                      if ports:
                          return (doc.get("metadata", {}).get("name"), ports[0].get("port"))
              return None


          def routes(manifests):
              """Every HTTPRoute with its hostnames, the path matches of its
              rules and the backends those rules point at."""
              found = []
              for doc in manifests:
                  if doc.get("kind") != "HTTPRoute":
                      continue
                  spec = doc.get("spec") or {}
                  matches, backends = [], []
                  for rule in spec.get("rules") or []:
                      for match in rule.get("matches") or []:
                          path = match.get("path") or {}
                          matches.append((path.get("type"), path.get("value")))
                      for ref in rule.get("backendRefs") or []:
                          backends.append((ref.get("name"), ref.get("port")))
                  found.append({
                      "name": doc.get("metadata", {}).get("name"),
                      "hostnames": spec.get("hostnames") or [],
                      "matches": matches,
                      "backends": backends,
                  })
              return found


          failures = []


          def require(condition, message):
              if not condition:
                  failures.append(f"{fixture}: {message}")


          # The narrowed layout: one path on the apex rule, the catch-all intact
          # on the delegated host, and the apex on a route of its own - off the
          # homeserver route, and claiming no root path on either exposure.
          manifests = docs(narrowed)
          backend = service(manifests)
          require(backend is not None, "the render has no Service to check the route backends against")
          service_name = backend[0] if backend else ""
          apex_paths = ingress_paths(manifests, APEX)
          require(apex_paths == [DISCOVERY], f"the apex Ingress rule renders {apex_paths} instead of {[DISCOVERY]}")
          delegated_paths = ingress_paths(manifests, DELEGATED)
          require(delegated_paths == ["/"], f"the delegated host does not keep its catch-all Ingress rule ({delegated_paths})")
          found = routes(manifests)
          require(len(found) == 2, f"the render has {len(found)} HTTPRoutes, expected the homeserver route and the apex route")
          apex_routes = [route for route in found if APEX in route["hostnames"]]
          require(len(apex_routes) == 1, f"the apex is in {len(apex_routes)} route hostname lists, expected the apex route alone")
          if len(apex_routes) == 1:
              apex_route = apex_routes[0]
              require(apex_route["name"] == f"{service_name}-server-name",
                      f"the apex is on {apex_route['name']} instead of {service_name}-server-name")
              require(apex_route["matches"] == [("PathPrefix", DISCOVERY)],
                      f"{apex_route['name']} matches {apex_route['matches']} instead of PathPrefix {DISCOVERY} alone")
              require(("PathPrefix", "/") not in apex_route["matches"],
                      f"{apex_route['name']} claims the apex root, which the split leaves to whatever else serves the apex")
              require(bool(apex_route["backends"]) and all(entry == backend for entry in apex_route["backends"]),
                      f"{apex_route['name']} does not point at {backend}")
          main_routes = [route for route in found if APEX not in route["hostnames"]]
          require(len(main_routes) == 1,
                  f"{len(main_routes)} routes serve the delegated host, expected the homeserver route alone")
          if len(main_routes) == 1:
              require(main_routes[0]["hostnames"] == [DELEGATED],
                      f"the homeserver route lists {main_routes[0]['hostnames']} instead of {[DELEGATED]}")
              require(main_routes[0]["matches"] == [("PathPrefix", "/")],
                      f"the homeserver route matches {main_routes[0]['matches']} instead of PathPrefix / alone")
              require(bool(main_routes[0]["backends"]) and all(entry == backend for entry in main_routes[0]["backends"]),
                      f"{main_routes[0]['name']} does not point at {backend}")

          # The same fixture with the value off: the apex route exists either
          # way, only its path set changes - so a condition that dropped
          # /_matrix everywhere cannot render this.
          manifests = docs(widened)
          apex_paths = ingress_paths(manifests, APEX)
          require(apex_paths is not None and set(apex_paths) == {DISCOVERY, "/_matrix"},
                  f"with serverNameWellKnownOnly=false the apex Ingress rule renders {apex_paths}: the discovery path and /_matrix are both expected")
          found = routes(manifests)
          require(len(found) == 2, f"with serverNameWellKnownOnly=false the render has {len(found)} HTTPRoutes, expected both")
          apex_routes = [route for route in found if APEX in route["hostnames"]]
          require(len(apex_routes) == 1,
                  f"with serverNameWellKnownOnly=false the apex is in {len(apex_routes)} route hostname lists, expected the apex route alone")
          if len(apex_routes) == 1:
              matches = apex_routes[0]["matches"]
              require(set(matches) == {("PathPrefix", DISCOVERY), ("PathPrefix", "/_matrix")},
                      f"with serverNameWellKnownOnly=false {apex_routes[0]['name']} matches {matches}: the discovery path and /_matrix are both expected")
              require(("PathPrefix", "/") not in matches,
                      f"with serverNameWellKnownOnly=false {apex_routes[0]['name']} claims the apex root, which the split leaves to whatever else serves the apex")
          main_routes = [route for route in found if APEX not in route["hostnames"]]
          require(len(main_routes) == 1,
                  f"with serverNameWellKnownOnly=false {len(main_routes)} routes serve the delegated host, expected the homeserver route alone")
          if len(main_routes) == 1:
              require(main_routes[0]["hostnames"] == [DELEGATED],
                      f"with serverNameWellKnownOnly=false the homeserver route lists {main_routes[0]['hostnames']} instead of {[DELEGATED]}")
              require(main_routes[0]["matches"] == [("PathPrefix", "/")],
                      f"with serverNameWellKnownOnly=false the homeserver route matches {main_routes[0]['matches']} instead of PathPrefix / alone")

          for failure in failures:
              print(f"::error::{failure}")
          if failures:
              sys.exit(1)
          PY
          echo "the apex serves the well-known documents alone when it is narrowed"

      # An immutable field cannot be seen in a single render: `spec.selector` of
      # a workload accepts the chart-version label the same way it accepts any
      # other, and only the *next* chart release discovers that the API server
      # refuses to change it (`spec.selector: Invalid value: ...: field is
      # immutable` - chart 2.0.1 shipped exactly that, so every upgrade of every
      # release it created failed). The two properties that keep it applyable are
      # checked on every render instead: a selector carries no label that moves
      # with the chart version, and the workload's own pod template carries
      # everything its selector asks for. Services are held to the first one as
      # well - their selector is mutable, but a chart-version label in it drops
      # every endpoint of the old pods the moment the new chart is applied.
      - name: Selectors are immutable and select their own pods
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/tuwunel-selectors.yaml"
          check() {
            local label="$1"
            shift
            helm template ci "$CHART_DIR" "$@" > "$manifest"
            python3 hack/selector-check.py "$manifest" "$label"
          }
          check "default values"
          for values in "$CHART_DIR"/ci/*-values.yaml; do
            check "$(basename "$values")" -f "$values"
          done

  schema:
    name: Value schema guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      # The schema is only worth having if it still refuses impossible values:
      # weakening it (or dropping it) has to break this job, not pass silently.
      - name: Impossible values must be rejected
        run: |
          set -euo pipefail
          shopt -s nullglob
          fixtures=("$CHART_DIR"/ci/invalid/*.yaml)
          if [ "${#fixtures[@]}" -eq 0 ]; then
            echo "::error::no fixtures under $CHART_DIR/ci/invalid/ - this check would pass without validating anything"
            exit 1
          fi
          status=0
          for values in "${fixtures[@]}"; do
            if out=$(helm template ci "$CHART_DIR" -f "$values" 2>&1); then
              echo "::error file=$values::$values was accepted, but it must be rejected by $CHART_DIR/values.schema.json"
              status=1
            elif ! grep -qi schema <<<"$out"; then
              echo "::error file=$values::$values failed for an unexpected reason (not schema validation):"
              echo "$out"
              status=1
            else
              echo "rejected as expected: $values"
            fi
          done
          exit $status

      # Not every impossible value is a schema question: the port that the
      # chart writes into TUWUNEL_PORT has to agree with service.port, and a
      # UDP port *range* cannot go through a Service - those are cross-value
      # rules the schema cannot express, so a template refuses them. The
      # refusal has to be the template's own and it has to name the value that
      # caused it, which every fixture declares in an `# expect-error:` line.
      - name: Values the templates must refuse
        run: |
          set -euo pipefail
          shopt -s nullglob
          fixtures=("$CHART_DIR"/ci/invalid-render/*.yaml)
          if [ "${#fixtures[@]}" -eq 0 ]; then
            echo "::error::no fixtures under $CHART_DIR/ci/invalid-render/ - this check would pass without validating anything"
            exit 1
          fi
          status=0
          for values in "${fixtures[@]}"; do
            expected=$(sed -n 's/^# expect-error: //p' "$values")
            if [ -z "$expected" ]; then
              echo "::error file=$values::$values has no '# expect-error: <substring>' line naming the value the render must report"
              status=1
              continue
            fi
            if out=$(helm template ci "$CHART_DIR" -f "$values" 2>&1); then
              echo "::error file=$values::$values rendered, but a template has to refuse it ($expected)"
              status=1
              continue
            fi
            if grep -qi schema <<<"$out"; then
              echo "::error file=$values::$values was rejected by values.schema.json, not by the template that owns the rule ($expected):"
              echo "$out"
              status=1
              continue
            fi
            if ! grep -qF "$expected" <<<"$out"; then
              echo "::error file=$values::$values was refused without naming '$expected':"
              echo "$out"
              status=1
              continue
            fi
            echo "refused by a template as expected: $values ($expected)"
          done
          exit $status

      - name: Supported value shapes must keep working
        run: |
          set -euo pipefail
          for values in "$CHART_DIR"/ci/*-values.yaml; do
            helm template ci "$CHART_DIR" -f "$values" > /dev/null
            echo "rendered: $values"
          done

  # The other jobs only prove the manifests have the right *shape*. `helm lint`,
  # `kubeconform` and values.schema.json never read the rendered config.toml,
  # and no schema says anything about the readiness path - yet both decide
  # whether tuwunel starts at all: a config value of the wrong TOML type
  # (`allow_federation = "false"` instead of `= false`) makes the process exit 1
  # at startup, and a path that answers 403 while federation is disabled leaves
  # the pod permanently NotReady. This job is the only gate that starts the real
  # image on every fixture, and it drives it with what that fixture renders: the
  # init container runs envsubst to produce the config the server really reads,
  # the probe command from the manifest itself is executed, the readiness URL is
  # the one the `helm test` pod uses, and a config that asks for online backups
  # gets the crontab's SIGUSR2 and has to produce a repository - so a path or a
  # name that only exists in the chart's own assumptions fails here.
  runtime:
    name: Runtime smoke test against the real image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      # Every fixture now runs the init container, an exec probe and the
      # readiness request; the container is removed after every fixture and by
      # the script's trap, so a leak can never mask the next one.
      - name: Start the image and probe it the way the manifests say
        run: hack/runtime-check.sh "$CHART_DIR"

  # The tag is a release request: its shape, the CHANGELOG section the release
  # body comes from, and the branch it was cut from are checked here, before the
  # expensive gates start.
  release-tag:
    name: Resolve the release tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
      section: ${{ steps.resolve.outputs.section }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the release from the tag
        id: resolve
        run: |
          set -euo pipefail
          # The two version shapes, the track classification and the CHANGELOG
          # section live in hack/release.sh - the same script the maintainer runs
          # to cut the tag, so the two cannot drift.
          hack/release.sh --check "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

          # Releases are cut from main: a tag on a commit main does not serve
          # would publish a chart nobody can reach from the branch, and the
          # version would be recorded on a history that never had it.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main - releases are cut from main"
            exit 1
          fi

  release:
    name: Release chart
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [release-tag, lint, schema, runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release at a time: two tags pushed close together would otherwise race
    # on the same branch, and the loser fails on a non-fast-forward push after
    # its release already exists.
    concurrency: chart-release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      # The tag carries the version, and the tagged tree still records the
      # *previous* release (the bump commit lands on main only after this job),
      # so the package is stamped from the tag. The artifact is then read back:
      # a package whose Chart.yaml does not carry the released version would
      # publish under a tag the index points at.
      - name: Package the chart at the released version
        env:
          VERSION: ${{ needs.release-tag.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf .cr-release-packages
          mkdir -p .cr-release-packages
          helm package "$CHART_DIR" --version "$VERSION" --destination .cr-release-packages
          chart_name=$(awk '/^name:/ { print $2; exit }' "$CHART_DIR/Chart.yaml")
          package=".cr-release-packages/${chart_name}-${VERSION}.tgz"
          if [ ! -f "$package" ]; then
            echo "::error::helm package produced no ${package}"
            exit 1
          fi
          if ! tar -xzOf "$package" "${chart_name}/Chart.yaml" | grep -qE "^version: \"?${VERSION}\"?$"; then
            echo "::error::the packaged chart does not carry the released version ${VERSION}"
            exit 1
          fi
          echo "::notice::packaged $(basename "$package") from the tag"

      # The action installs the pinned `cr` binary only: its own release path
      # cannot be used here. It packages "charts changed since the previous
      # tag", which is not the contract, and with packaging skipped its script
      # dies on an unbound variable (`cr.sh` writes `chart_version=${latest_tag}`
      # outside the branch that sets it, under `set -o nounset`) after the
      # upload has already succeeded - fixed on the action's `main`, unreleased
      # as of v1.7.0. `cr index` is what is needed from the binary.
      - name: Install chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          version: ${{ env.CHART_RELEASER_VERSION }}
          install_only: true

      # The release is created here rather than by `cr upload`, because `cr`
      # cannot create a pre-release (chart-releaser v1.8.1 has no such flag) and
      # a candidate that exists unflagged - even for the seconds between two
      # steps - is a release consumers see as stable, which is exactly what a
      # run that died after the upload used to leave behind. The flag and the
      # body are part of the create call, and a re-run after a failed step finds
      # the release and updates it instead, so the step is idempotent.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-tag.outputs.tag }}
          VERSION: ${{ needs.release-tag.outputs.version }}
          SECTION: ${{ needs.release-tag.outputs.section }}
          CHANNEL: ${{ needs.release-tag.outputs.channel }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          trap 'rm -f "$notes"' EXIT
          hack/release-notes.sh "$VERSION" "$SECTION" > "$notes"
          chart_name=$(awk '/^name:/ { print $2; exit }' "$CHART_DIR/Chart.yaml")
          package=".cr-release-packages/${chart_name}-${VERSION}.tgz"
          args=(--title "$TAG" --notes-file "$notes")
          if [ "$CHANNEL" = "rc" ]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" "${args[@]}"
          else
            gh release create "$TAG" --verify-tag "${args[@]}"
          fi
          gh release upload "$TAG" "$package" --clobber
          echo "::notice::$TAG published from the ${CHANNEL} track with the CHANGELOG.md body"

      # `cr index` reads the release and its asset back out of GitHub and
      # rewrites `index.yaml` on gh-pages; the package it indexes is the one
      # this job built. It keeps its local copy of the index at
      # `.cr-index/index.yaml` and does not create the directory (the action's
      # own script did), so a missing `.cr-index` fails after the release is
      # already published.
      #
      # `cr` looks the release up *by tag*, and the tag it looks for is the
      # release-name template it is given: its default is `<chart name>-<version>`
      # (`tuwunel-<version>`), which is not the tag this repository pushes. The
      # template therefore names the prefix the same way `hack/release.sh` does.
      - name: Publish the chart repository index
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          mkdir -p .cr-index
          cr index -o "$owner" -r "$repo" \
            --release-name-template 'release-{{ .Version }}' \
            --push

      # The tag is the source of truth, so the branch records the release after
      # the fact: a commit whose only change is the version line. A push made
      # with GITHUB_TOKEN starts no run by itself, and `[skip ci]` keeps the
      # commit out of a pipeline if the token ever changes to a PAT.
      - name: Record the released version on main
        env:
          TAG: ${{ needs.release-tag.outputs.tag }}
          VERSION: ${{ needs.release-tag.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git checkout --quiet -B main origin/main

          current=$(awk '/^version:/ { print $2; exit }' "$CHART_DIR/Chart.yaml")
          if [ "$current" = "$VERSION" ]; then
            echo "::notice::main already records ${VERSION}; nothing to commit"
            exit 0
          fi

          # main never moves backwards: a release cut from an older commit (a
          # backfill of an old line) publishes and leaves the branch alone, and
          # patch releases on an older line would need a release branch that does
          # not exist yet.
          core_current="${current%%-*}"
          core_released="${VERSION%%-*}"
          if [ "$core_current" != "$core_released" ]; then
            lower=$(printf '%s\n%s\n' "$core_current" "$core_released" | sort -V | head -n1)
            if [ "$lower" = "$core_released" ]; then
              echo "::warning::main records ${current}, which is newer than ${VERSION} - the branch is left alone"
              exit 0
            fi
          fi

          sed -i "s/^version: .*/version: ${VERSION}/" "$CHART_DIR/Chart.yaml"
          grep -qxF "version: ${VERSION}" "$CHART_DIR/Chart.yaml"
          git add "$CHART_DIR/Chart.yaml"
          git commit --message "chore(release): record ${TAG} [skip ci]"
          git push --quiet origin main
          echo "::notice::main now records ${VERSION}"

      - name: Summarize
        env:
          TAG: ${{ needs.release-tag.outputs.tag }}
          CHANNEL: ${{ needs.release-tag.outputs.channel }}
          VERSION: ${{ needs.release-tag.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "### Chart release"
            echo ""
            echo "- \`${TAG}\` published from the ${CHANNEL} track"
            echo "- chart version recorded on main: \`${VERSION}\`"
            echo "- index: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/index.yaml"
          } >> "$GITHUB_STEP_SUMMARY"
